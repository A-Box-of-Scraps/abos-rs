name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install workspace Rust toolchain
        run: rustup toolchain install

      - name: Install lint Rust toolchain
        working-directory: lints
        run: rustup toolchain install

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            lints

      - name: Install and cache mise tools
        uses: jdx/mise-action@v5
        with:
          cache: true

      - run: mise run check
