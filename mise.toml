[tools]
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"

[settings]
task.output = "interleave"
task.quiet = true

[vars]
cargo_workspace = "--locked --workspace"
cargo_targets = "--all-targets"
cargo_features = "--all-features -q"
cargo_fmt = "--all -q"
dprint_log = "--log-level warn"

[tasks]
# Check
check = { depends = ["fmt:check", "lint", "check:duplicates", "test"] }
"check:duplicates" = { run = "jscpd --fail-on-empty --no-tips" }

# Format
fmt = { run = [
  "mise fmt -q",
  "cargo fmt {{vars.cargo_fmt}}",
  "dprint fmt {{vars.dprint_log}}",
] }
"fmt:check" = { run = [
  "mise fmt --check -q",
  "cargo fmt {{vars.cargo_fmt}} --check",
  "dprint check {{vars.dprint_log}}",
] }

# Build
build = { depends = ["build:rust"] }
"build:rust" = { run = "cargo build {{vars.cargo_workspace}}" }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }

# Lint
lint = { depends = ["lint:rust"] }

"lint:rust" = { depends = [
  "lint:rust:docs",
], env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy {{vars.cargo_workspace}} {{vars.cargo_targets}} {{vars.cargo_features}}" }
"lint:rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} --no-deps" }

"lint:fix" = { depends = ["lint:rust:fix"] }
"lint:rust:fix" = { run = "cargo clippy --fix {{vars.cargo_workspace}} {{vars.cargo_features}}" }

# Test
test = { depends = ["test:rust"] }
"test:rust" = { run = "cargo test {{vars.cargo_workspace}} {{vars.cargo_features}} --no-fail-fast" }
