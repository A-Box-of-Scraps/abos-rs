[tools]
"cargo:cargo-dylint" = "6.4.0"
"cargo:dylint-link" = "6.4.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-nextest = "0.9.152"
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"
mold = { version = "3.0.0", os = ["linux"] }
ruff = "0.17.6"
"pypi:basedpyright" = "1.40.2"
uv = "0.13.9"

[settings]
task.output = "interleave"
task.quiet = true

[vars]
# Arguments
cargo_workspace = "--locked --workspace"
cargo_features = "--all-features"
cargo_fmt = "--all"
quiet = "-q"
file_line_threshold = "80"
coverage_report = "target/coverage-summary.json"
fmt_check = "--check"

# Commands
dylint_command = "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features --locked -q"
build_command = "cargo build {{vars.cargo_workspace}}"
clippy_command = "cargo clippy {{vars.cargo_workspace}} --all-targets {{vars.cargo_features}} {{vars.quiet}}"
doc_command = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}} --no-deps"
clippy_fix_command = "cargo clippy --fix {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}}"
fmt_command = "cargo fmt {{vars.cargo_fmt}} {{vars.quiet}}"

[tasks]
# Check
check = { depends = ["fmt:check", "lint", "check:duplicates", "test"] }
"check:duplicates" = { run = "jscpd --no-tips" }

# Format
fmt = { depends = ["fmt:rust", "fmt:lints", "fmt:config"] }
"fmt:check" = { depends = [
  "fmt:rust:check",
  "fmt:lints:check",
  "fmt:config:check",
] }

"fmt:rust" = { run = "{{vars.fmt_command}}" }
"fmt:rust:check" = { run = "{{vars.fmt_command}} {{vars.fmt_check}}" }
"fmt:config" = { run = [
  "mise fmt {{vars.quiet}}",
  "dprint fmt --log-level warn",
] }
"fmt:config:check" = { run = [
  "mise fmt {{vars.fmt_check}} {{vars.quiet}}",
  "dprint check --log-level warn",
] }
"fmt:lints" = { dir = "lints", run = "{{vars.fmt_command}}" }
"fmt:lints:check" = { dir = "lints", run = "{{vars.fmt_command}} {{vars.fmt_check}}" }

# Build
build = { depends = ["build:rust", "build:lints"] }
"build:rust" = { run = "{{vars.build_command}}" }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }
"build:lints" = { dir = "lints", run = "{{vars.build_command}}" }

# Lint
lint = { depends = ["lint:rust", "lint:lints", "lint:dylint", "lint:python"] }

"lint:dylint" = { depends = ["lint:dylint:packages", "lint:dylint:lints"] }
"lint:dylint:packages" = { env = { DYLINT_RUSTFLAGS = "-D warnings" }, run = "{{vars.dylint_command}}" }
"lint:dylint:lints" = { dir = "lints", env = { DYLINT_RUSTFLAGS = "-D warnings" }, run = "{{vars.dylint_command}}" }

"lint:rust" = { depends = [
  "lint:rust:docs",
], env = { CARGO_BUILD_WARNINGS = "deny" }, run = "{{vars.clippy_command}}" }
"lint:rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "{{vars.doc_command}}" }

"lint:lints" = { depends = [
  "lint:lints:docs",
], dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "{{vars.clippy_command}}" }
"lint:lints:docs" = { dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "{{vars.doc_command}}" }

"lint:python" = { run = ["ruff check scripts", "basedpyright scripts"] }

## Lint fixes
"lint:fix" = { depends = [
  "lint:rust:fix",
  "lint:lints:fix",
  "lint:python:fix",
] }
"lint:rust:fix" = { run = "{{vars.clippy_fix_command}}" }
"lint:lints:fix" = { dir = "lints", run = "{{vars.clippy_fix_command}}" }

"lint:python:fix" = { run = [
  "ruff check --fix scripts",
  "basedpyright scripts",
] }

# Test
test = { depends = ["test:rust", "test:lints"] }
"test:rust" = { run = [
  "cargo llvm-cov nextest --no-clean {{vars.cargo_workspace}} --cargo-quiet {{vars.cargo_features}} --no-tests=warn --no-fail-fast --json --summary-only --output-path {{vars.coverage_report}}",
  "python3 scripts/coverage_summary.py --min-file-lines {{vars.file_line_threshold}} < {{vars.coverage_report}}",
  "cargo llvm-cov report {{vars.quiet}} --fail-under-file-lines {{vars.file_line_threshold}} --fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80 > /dev/null",
] }
"test:lints" = { dir = "lints", run = "uv run --no-project python ../scripts/test_lints.py --min-file-lines {{vars.file_line_threshold}} --output-path {{vars.coverage_report}} {{vars.cargo_workspace}} {{vars.cargo_features}}" }
