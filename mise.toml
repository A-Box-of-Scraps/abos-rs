[tools]
"cargo:cargo-dylint" = "6.4.0"
"cargo:dylint-link" = "6.4.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-nextest = "0.9.152"
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"
mold = { version = "3.0.0", os = ["linux"] }
ruff = "0.17.6"
"pypi:basedpyright" = "1.40.2"
uv = "0.13.9"

[settings]
task.output = "interleave"
task.quiet = true

[tasks]
# Check
check = { depends = ["fmt:check", "lint", "check:duplicates", "test"] }
"check:duplicates" = { run = "jscpd --no-tips" }

# Format
fmt = { depends = ["fmt:rust", "fmt:lints", "fmt:config"] }
"fmt:check" = { depends = [
  "fmt:rust:check",
  "fmt:lints:check",
  "fmt:config:check",
] }

"fmt:rust" = { run = "cargo fmt --all -q" }
"fmt:rust:check" = { run = "cargo fmt --all -q --check" }
"fmt:config" = { run = [
  "mise fmt -q",
  "dprint fmt --log-level warn",
] }
"fmt:config:check" = { run = [
  "mise fmt --check -q",
  "dprint check --log-level warn",
] }
"fmt:lints" = { dir = "lints", run = "cargo fmt --all -q" }
"fmt:lints:check" = { dir = "lints", run = "cargo fmt --all -q --check" }

# Build
build = { depends = ["build:rust", "build:lints"] }
"build:rust" = { run = "cargo build --locked --workspace" }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }
"build:lints" = { dir = "lints", run = "cargo build --locked --workspace" }

# Lint
lint = { depends = ["lint:rust", "lint:lints", "lint:dylint", "lint:python"] }

"lint:dylint" = { depends = ["lint:dylint:packages", "lint:dylint:lints"] }
"lint:dylint:packages" = { env = { DYLINT_RUSTFLAGS = "-D warnings" }, run = "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features --locked -q" }
"lint:dylint:lints" = { dir = "lints", env = { DYLINT_RUSTFLAGS = "-D warnings" }, run = "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features --locked -q" }

"lint:rust" = { depends = [
  "lint:rust:docs",
], env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy --locked --workspace --all-targets --all-features -q" }
"lint:rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc --locked --workspace --all-features -q --no-deps" }

"lint:lints" = { depends = [
  "lint:lints:docs",
], dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy --locked --workspace --all-targets --all-features -q" }
"lint:lints:docs" = { dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc --locked --workspace --all-features -q --no-deps" }

"lint:python" = { run = ["ruff check scripts", "basedpyright scripts"] }

## Lint fixes
"lint:fix" = { depends = [
  "lint:rust:fix",
  "lint:lints:fix",
  "lint:python:fix",
] }
"lint:rust:fix" = { run = "cargo clippy --fix --locked --workspace --all-features -q" }
"lint:lints:fix" = { dir = "lints", run = "cargo clippy --fix --locked --workspace --all-features -q" }

"lint:python:fix" = { run = [
  "ruff check --fix scripts",
  "basedpyright scripts",
] }

# Test
test = { depends = ["test:rust", "test:lints"] }
"test:rust" = { run = [
  "cargo llvm-cov nextest --no-clean --locked --workspace --cargo-quiet --all-features --no-tests=warn --no-fail-fast --json --summary-only --output-path target/coverage-summary.json",
  "python3 scripts/coverage_summary.py --min-file-lines 80 < target/coverage-summary.json",
  "cargo llvm-cov report -q --fail-under-file-lines 80 --fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80 > /dev/null",
] }
"test:lints" = { dir = "lints", run = "uv run --no-project python ../scripts/test_lints.py --min-file-lines 80 --output-path target/coverage-summary.json --locked --workspace --all-features" }
