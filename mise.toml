[tools]
"cargo:cargo-dylint" = "6.4.0"
"cargo:dylint-link" = "6.4.0"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-nextest = "0.9.152"
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"
mold = { version = "3.0.0", os = ["linux"] }
ruff = "0.17.6"
"pypi:basedpyright" = "1.40.2"
uv = "0.13.9"

[settings]
task.output = "interleave"
task.quiet = true

[task_templates]
"rust:fmt" = { run = "cargo fmt --all -q" }
"rust:fmt:check" = { run = "cargo fmt --all -q --check" }
"rust:build" = { run = "cargo build --locked --workspace" }
"rust:dylint" = { env = { DYLINT_RUSTFLAGS = "-D warnings" }, run = "cargo dylint --all --workspace --fail-on-no-libraries -q -- --all-targets --all-features --locked -q" }
"rust:clippy" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy --locked --workspace --all-targets --all-features -q" }
"rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc --locked --workspace --all-features -q --no-deps" }
"rust:clippy:fix" = { run = "cargo clippy --fix --locked --workspace --all-features -q" }

[tasks]
# Build
build = { depends = ["build:packages", "build:lints"] }
"build:packages" = { extends = "rust:build", dir = "." }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }
"build:lints" = { extends = "rust:build", dir = "lints" }

# Check
check = { run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "check:duplicates" },
  { task = "test" },
] }
"check:duplicates" = { run = "jscpd --no-tips" }

# Format
fmt = { depends = ["fmt:packages", "fmt:lints", "fmt:config"] }

"fmt:packages" = { extends = "rust:fmt", dir = "." }
"fmt:lints" = { extends = "rust:fmt", dir = "lints" }
"fmt:config" = { depends = ["mise:fmt", "dprint:fmt"] }

"mise:fmt" = { run = "mise fmt" }
"dprint:fmt" = { run = "dprint fmt --log-level warn" }

# Format check
"fmt:check" = { depends = [
  "fmt:packages:check",
  "fmt:lints:check",
  "fmt:config:check",
] }

"fmt:packages:check" = { extends = "rust:fmt:check", dir = "." }
"fmt:lints:check" = { extends = "rust:fmt:check", dir = "lints" }
"fmt:config:check" = { depends = ["mise:fmt:check", "dprint:fmt:check"] }

"mise:fmt:check" = { run = "mise fmt --check" }
"dprint:fmt:check" = { run = "dprint check --log-level warn" }

# Lint
lint = { depends = [
  "lint:packages",
  "lint:lints",
  "lint:dylint",
  "lint:python",
] }

"lint:dylint" = { depends = ["lint:dylint:packages", "lint:dylint:lints"] }
"lint:dylint:packages" = { extends = "rust:dylint", dir = "." }
"lint:dylint:lints" = { extends = "rust:dylint", dir = "lints" }

"lint:packages" = { extends = "rust:clippy", dir = ".", depends = [
  "lint:packages:docs",
] }
"lint:packages:docs" = { extends = "rust:docs", dir = "." }

"lint:lints" = { extends = "rust:clippy", dir = "lints", depends = [
  "lint:lints:docs",
] }
"lint:lints:docs" = { extends = "rust:docs", dir = "lints" }

"lint:python" = { run = ["ruff check scripts", "basedpyright scripts"] }

## Lint fixes
"lint:fix" = { depends = [
  "lint:packages:fix",
  "lint:lints:fix",
  "lint:python:fix",
] }
"lint:packages:fix" = { extends = "rust:clippy:fix", dir = "." }
"lint:lints:fix" = { extends = "rust:clippy:fix", dir = "lints" }

"lint:python:fix" = { run = "ruff check --fix scripts" }

# Test
test = { depends = ["test:packages", "test:lints"] }
"test:packages" = { run = [
  "cargo llvm-cov nextest --no-clean --locked --workspace --cargo-quiet --all-features --no-tests=warn --no-fail-fast --json --summary-only --output-path target/coverage-summary.json",
  "python3 scripts/coverage_summary.py --min-file-lines 80 < target/coverage-summary.json",
  "cargo llvm-cov report -q --fail-under-file-lines 80 --fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80 > /dev/null",
] }
"test:lints" = { dir = "lints", run = "uv run --no-project python ../scripts/test_lints.py --min-file-lines 80 --output-path target/coverage-summary.json --locked --workspace --all-features" }
