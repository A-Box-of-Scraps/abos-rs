[tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-nextest = "0.9.152"
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"
mold = { version = "3.0.0", os = ["linux"] }
ruff = "0.17.6"
"pypi:basedpyright" = "1.40.2"

[settings]
task.output = "interleave"
task.quiet = true

[vars]
cargo_workspace = "--locked --workspace"
cargo_features = "--all-features"
cargo_fmt = "--all"
quiet = "-q"
file_line_threshold = "80"
coverage_report = "target/coverage-summary.json"
fmt_check = "--check"

[tasks]
# Check
check = { depends = ["fmt:check", "lint", "check:duplicates", "test"] }
"check:duplicates" = { run = "jscpd --no-tips" }

# Format
fmt = { depends = ["fmt:rust", "fmt:lints", "fmt:config"] }
"fmt:check" = { depends = [
  "fmt:rust:check",
  "fmt:lints:check",
  "fmt:config:check",
] }

"fmt:rust" = { run = "cargo fmt {{vars.cargo_fmt}} {{vars.quiet}}" }
"fmt:rust:check" = { run = "cargo fmt {{vars.cargo_fmt}} {{vars.quiet}} {{vars.fmt_check}}" }
"fmt:config" = { run = [
  "mise fmt {{vars.quiet}}",
  "dprint fmt --log-level warn",
] }
"fmt:config:check" = { run = [
  "mise fmt {{vars.fmt_check}} {{vars.quiet}}",
  "dprint check --log-level warn",
] }
"fmt:lints" = { dir = "lints", run = "cargo fmt {{vars.cargo_fmt}} {{vars.quiet}}" }
"fmt:lints:check" = { dir = "lints", run = "cargo fmt {{vars.cargo_fmt}} {{vars.quiet}} {{vars.fmt_check}}" }

# Build
build = { depends = ["build:rust", "build:lints"] }
"build:rust" = { run = "cargo build {{vars.cargo_workspace}}" }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }
"build:lints" = { dir = "lints", run = "cargo build {{vars.cargo_workspace}}" }

# Lint
lint = { depends = ["lint:rust", "lint:lints", "lint:python"] }

"lint:rust" = { depends = [
  "lint:rust:docs",
], env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy {{vars.cargo_workspace}} --all-targets {{vars.cargo_features}} {{vars.quiet}}" }
"lint:rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}} --no-deps" }

"lint:lints" = { depends = [
  "lint:lints:docs",
], dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy {{vars.cargo_workspace}} --all-targets {{vars.cargo_features}} {{vars.quiet}}" }
"lint:lints:docs" = { dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}} --no-deps" }

"lint:python" = { run = ["ruff check scripts", "basedpyright scripts"] }

## Lint fixes
"lint:fix" = { depends = [
  "lint:rust:fix",
  "lint:lints:fix",
  "lint:python:fix",
] }
"lint:rust:fix" = { run = "cargo clippy --fix {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}}" }
"lint:lints:fix" = { dir = "lints", run = "cargo clippy --fix {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.quiet}}" }

"lint:python:fix" = { run = [
  "ruff check --fix scripts",
  "basedpyright scripts",
] }

# Test
test = { depends = ["test:rust", "test:lints"] }
"test:rust" = { run = [
  "cargo llvm-cov nextest --no-clean {{vars.cargo_workspace}} --cargo-quiet {{vars.cargo_features}} --no-tests=warn --no-fail-fast --json --summary-only --output-path {{vars.coverage_report}}",
  "python3 scripts/coverage_summary.py --min-file-lines {{vars.file_line_threshold}} < {{vars.coverage_report}}",
  "cargo llvm-cov report {{vars.quiet}} --fail-under-file-lines {{vars.file_line_threshold}} --fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80 > /dev/null",
] }
"test:lints" = { dir = "lints", run = [
  "cargo llvm-cov nextest --no-clean {{vars.cargo_workspace}} --cargo-quiet {{vars.cargo_features}} --no-tests=warn --no-fail-fast --json --summary-only --output-path {{vars.coverage_report}}",
  "python3 ../scripts/coverage_summary.py --min-file-lines {{vars.file_line_threshold}} < {{vars.coverage_report}}",
  "cargo llvm-cov report {{vars.quiet}} --fail-under-file-lines {{vars.file_line_threshold}} --fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80 > /dev/null",
] }
