[tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-nextest = "0.9.152"
"cargo:jscpd" = "5.4.3"
dprint = "0.65.0"
mold = { version = "3.0.0", os = ["linux"] }

[settings]
task.output = "interleave"
task.quiet = true

[vars]
cargo_workspace = "--locked --workspace"
cargo_targets = "--all-targets"
cargo_features = "--all-features -q"
cargo_fmt = "--all -q"
nextest_flags = "--cargo-quiet --all-features --no-tests=warn"
file_line_threshold = "80"
coverage_thresholds = "--fail-under-lines 80 --fail-under-functions 80 --fail-under-regions 80"
coverage_report = "target/coverage-summary.json"
cargo_no_fail_fast = "--no-fail-fast"
cargo_fix = "--fix"
cargo_no_deps = "--no-deps"
fmt_check = "--check"
dprint_log = "--log-level warn"

[tasks]
# Check
check = { depends = ["fmt:check", "lint", "check:duplicates", "test"] }
"check:duplicates" = { run = "jscpd --no-tips" }

# Format
fmt = { depends = ["fmt:rust", "fmt:lints", "fmt:config"] }
"fmt:check" = { depends = [
  "fmt:rust:check",
  "fmt:lints:check",
  "fmt:config:check",
] }

"fmt:rust" = { run = "cargo fmt {{vars.cargo_fmt}}" }
"fmt:rust:check" = { run = "cargo fmt {{vars.cargo_fmt}} {{vars.fmt_check}}" }
"fmt:config" = { run = ["mise fmt -q", "dprint fmt {{vars.dprint_log}}"] }
"fmt:config:check" = { run = [
  "mise fmt {{vars.fmt_check}} -q",
  "dprint check {{vars.dprint_log}}",
] }
"fmt:lints" = { dir = "lints", run = "cargo fmt {{vars.cargo_fmt}}" }
"fmt:lints:check" = { dir = "lints", run = "cargo fmt {{vars.cargo_fmt}} {{vars.fmt_check}}" }

# Build
build = { depends = ["build:rust", "build:lints"] }
"build:rust" = { run = "cargo build {{vars.cargo_workspace}}" }
"build:hello-world" = { run = "cargo build --locked --package hello-world" }
"build:lints" = { dir = "lints", run = "cargo build {{vars.cargo_workspace}}" }

# Lint
lint = { depends = ["lint:rust", "lint:lints"] }

"lint:rust" = { depends = [
  "lint:rust:docs",
], env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy {{vars.cargo_workspace}} {{vars.cargo_targets}} {{vars.cargo_features}}" }
"lint:rust:docs" = { env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.cargo_no_deps}}" }

"lint:lints" = { depends = [
  "lint:lints:docs",
], dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo clippy {{vars.cargo_workspace}} {{vars.cargo_targets}} {{vars.cargo_features}}" }
"lint:lints:docs" = { dir = "lints", env = { CARGO_BUILD_WARNINGS = "deny" }, run = "cargo doc {{vars.cargo_workspace}} {{vars.cargo_features}} {{vars.cargo_no_deps}}" }

## Lint fixes
"lint:fix" = { depends = ["lint:rust:fix", "lint:lints:fix"] }
"lint:rust:fix" = { run = "cargo clippy {{vars.cargo_fix}} {{vars.cargo_workspace}} {{vars.cargo_features}}" }
"lint:lints:fix" = { dir = "lints", run = "cargo clippy {{vars.cargo_fix}} {{vars.cargo_workspace}} {{vars.cargo_features}}" }

# Test
test = { depends = ["test:rust", "test:lints"] }
"test:rust" = { run = [
  "cargo llvm-cov nextest --no-clean {{vars.cargo_workspace}} {{vars.nextest_flags}} {{vars.cargo_no_fail_fast}} --json --summary-only --output-path {{vars.coverage_report}}",
  "python3 scripts/coverage_summary.py --min-file-lines {{vars.file_line_threshold}} < {{vars.coverage_report}}",
  "cargo llvm-cov report -q --fail-under-file-lines {{vars.file_line_threshold}} {{vars.coverage_thresholds}} > /dev/null",
] }
"test:lints" = { dir = "lints", run = [
  "cargo llvm-cov nextest --no-clean {{vars.cargo_workspace}} {{vars.nextest_flags}} {{vars.cargo_no_fail_fast}} --json --summary-only --output-path {{vars.coverage_report}}",
  "python3 ../scripts/coverage_summary.py --min-file-lines {{vars.file_line_threshold}} < {{vars.coverage_report}}",
  "cargo llvm-cov report -q --fail-under-file-lines {{vars.file_line_threshold}} {{vars.coverage_thresholds}} > /dev/null",
] }
