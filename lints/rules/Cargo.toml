[package]
name = "abos-rust-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "A Box of Scraps's Rust lint rules."

[package.metadata.rust-analyzer]
rustc_private = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
# The UI tests exercise the loaded plugin, not a separate libtest binary.
test = false

[dependencies]
dylint_linting.workspace = true
serde.workspace = true

[dev-dependencies]
dylint_testing.workspace = true
tempfile.workspace = true

[[test]]
name = "explicit_binding_types"
path = "test/explicit_binding_types.rs"

[[test]]
name = "file_max_length"
path = "test/file_max_length.rs"

[[test]]
name = "max_logical_operators"
path = "test/max_logical_operators.rs"

[[test]]
name = "no_duplicate_strings"
path = "test/no_duplicate_strings.rs"

[[test]]
name = "no_inline_logical_conditions"
path = "test/no_inline_logical_conditions.rs"

[[test]]
name = "no_magic_numbers"
path = "test/no_magic_numbers.rs"

[[test]]
name = "tests_outside_src"
path = "test/tests_outside_src.rs"
